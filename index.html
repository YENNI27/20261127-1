<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反詐安全防線：社群私訊與求職模擬器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入 Google Fonts (Noto Sans TC & Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
        }
        /* 自訂滾動條樣式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* 訊息彈出動畫 */
        @keyframes msgPop {
            0% { opacity: 0; transform: translateY(10px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-msg {
            animation: msgPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* 打字機點點動畫 */
        .typing-dot {
            animation: typingBlink 1.4s infinite both;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBlink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 text-slate-800">

    <!-- 主容器：模擬現代應用程式介面 -->
    <div id="app" class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200 flex flex-col md:flex-row min-h-[85vh] max-h-[92vh]">
        
        <!-- 左側邊欄：情境選擇與安全指標 (在手機版可切換或頂部顯示) -->
        <aside class="w-full md:w-64 lg:w-72 bg-slate-900 text-white p-4 flex flex-col justify-between shrink-0">
            <div>
                <!-- 品牌標題 -->
                <div class="flex items-center gap-2.5 mb-5">
                    <div class="w-9 h-9 rounded-xl bg-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 shrink-0">
                        <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base tracking-wide">反詐安全防線</h1>
                        <p class="text-[11px] text-slate-400">青少年數位素養互動模擬</p>
                    </div>
                </div>

                <!-- 安全指數儀表板 -->
                <div class="bg-slate-800/80 rounded-2xl p-3.5 mb-5 border border-slate-700/80">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-medium text-slate-300 flex items-center gap-1.5">
                            <i data-lucide="heart-pulse" class="w-4 h-4 text-emerald-400"></i> 個人安全指數
                        </span>
                        <span id="safety-score-text" class="text-sm font-bold text-emerald-400">100 / 100</span>
                    </div>
                    <div class="w-full bg-slate-700 rounded-full h-2 overflow-hidden">
                        <div id="safety-bar" class="bg-emerald-400 h-2 rounded-full transition-all duration-500" style="width: 100%"></div>
                    </div>
                    <p id="safety-status-desc" class="text-[11px] text-slate-400 mt-2">
                        保持警覺！注意對話中的可疑要求與話術。
                    </p>
                </div>

                <!-- 劇本選擇清單 -->
                <div class="space-y-1.5 max-h-[38vh] md:max-h-[46vh] overflow-y-auto pr-1">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-1 sticky top-0 bg-slate-900 py-1 z-10">選擇模擬情境 (共 5 關)</p>
                    
                    <button type="button" data-action="start-scenario" data-scenario="job" id="btn-scenario-job" class="w-full text-left p-2.5 rounded-2xl transition-all border border-transparent hover:bg-slate-800 flex items-start gap-2.5 group">
                        <div class="w-7 h-7 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0 mt-0.5 group-hover:scale-110 transition-transform">
                            <i data-lucide="briefcase" class="w-4 h-4"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-semibold text-xs text-slate-100 flex items-center gap-1 flex-wrap">
                                情境一：高薪居家打工
                                <span id="badge-job" class="hidden text-[10px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded-md">已完成</span>
                            </div>
                            <p class="text-[11px] text-slate-400 mt-0.5 truncate">聽歌打字員，免經驗日領三千？</p>
                        </div>
                    </button>

                    <button type="button" data-action="start-scenario" data-scenario="social" id="btn-scenario-social" class="w-full text-left p-2.5 rounded-2xl transition-all border border-transparent hover:bg-slate-800 flex items-start gap-2.5 group">
                        <div class="w-7 h-7 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center shrink-0 mt-0.5 group-hover:scale-110 transition-transform">
                            <i data-lucide="message-circle-heart" class="w-4 h-4"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-semibold text-xs text-slate-100 flex items-center gap-1 flex-wrap">
                                情境二：社群私訊交友
                                <span id="badge-social" class="hidden text-[10px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded-md">已完成</span>
                            </div>
                            <p class="text-[11px] text-slate-400 mt-0.5 truncate">陌生帥氣帳號熱情搭訕帶投資？</p>
                        </div>
                    </button>

                    <button type="button" data-action="start-scenario" data-scenario="order" id="btn-scenario-order" class="w-full text-left p-2.5 rounded-2xl transition-all border border-transparent hover:bg-slate-800 flex items-start gap-2.5 group">
                        <div class="w-7 h-7 rounded-xl bg-sky-500/20 text-sky-400 flex items-center justify-center shrink-0 mt-0.5 group-hover:scale-110 transition-transform">
                            <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-semibold text-xs text-slate-100 flex items-center gap-1 flex-wrap">
                                情境三：電商刷單小幫手
                                <span id="badge-order" class="hidden text-[10px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded-md">已完成</span>
                            </div>
                            <p class="text-[11px] text-slate-400 mt-0.5 truncate">代墊衝評價，前兩單真的有退錢？</p>
                        </div>
                    </button>

                    <button type="button" data-action="start-scenario" data-scenario="model" id="btn-scenario-model" class="w-full text-left p-2.5 rounded-2xl transition-all border border-transparent hover:bg-slate-800 flex items-start gap-2.5 group">
                        <div class="w-7 h-7 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center shrink-0 mt-0.5 group-hover:scale-110 transition-transform">
                            <i data-lucide="camera" class="w-4 h-4"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-semibold text-xs text-slate-100 flex items-center gap-1 flex-wrap">
                                情境四：網拍星探試鏡邀約
                                <span id="badge-model" class="hidden text-[10px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded-md">已完成</span>
                            </div>
                            <p class="text-[11px] text-slate-400 mt-0.5 truncate">被挖掘當網拍模特兒，要求傳私密照？</p>
                        </div>
                    </button>

                    <button type="button" data-action="start-scenario" data-scenario="friend" id="btn-scenario-friend" class="w-full text-left p-2.5 rounded-2xl transition-all border border-transparent hover:bg-slate-800 flex items-start gap-2.5 group">
                        <div class="w-7 h-7 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0 mt-0.5 group-hover:scale-110 transition-transform">
                            <i data-lucide="user-check" class="w-4 h-4"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-semibold text-xs text-slate-100 flex items-center gap-1 flex-wrap">
                                情境五：學長私訊借錢與投票
                                <span id="badge-friend" class="hidden text-[10px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded-md">已完成</span>
                            </div>
                            <p class="text-[11px] text-slate-400 mt-0.5 truncate">認識的同學突然傳投票連結又借錢？</p>
                        </div>
                    </button>
                </div>

                <!-- 總結算報告按鈕 (完成全5關後解鎖顯示) -->
                <div id="final-summary-banner" class="hidden mt-3">
                    <button type="button" data-action="open-final-report" class="w-full py-2.5 px-3 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold text-xs shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-1.5">
                        <i data-lucide="trophy" class="w-4 h-4"></i> 查看全 5 關綜合安全指數
                    </button>
                </div>
            </div>

            <!-- 底部提示與求助專線 -->
            <div class="mt-6 pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                <div class="flex items-center gap-2">
                    <i data-lucide="phone-call" class="w-4 h-4 text-amber-400"></i>
                    <span>反詐騙諮詢專線：<strong class="text-white">165</strong></span>
                </div>
                <button type="button" data-action="open-guide" class="text-indigo-400 hover:text-indigo-300 underline">
                    防詐錦囊
                </button>
            </div>
        </aside>

        <!-- 右側主畫面：模擬手機通訊軟體視窗 -->
        <main class="flex-1 flex flex-col bg-slate-50 relative overflow-hidden">
            
            <!-- 初始歡迎畫面 (尚未選擇情境時顯示) -->
            <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center p-8 text-center">
                <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-3xl flex items-center justify-center mb-6 shadow-inner">
                    <i data-lucide="smartphone" class="w-10 h-10"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-3">準備好測試你的「防詐雷達」了嗎？</h2>
                <p class="text-slate-600 max-w-md mb-8 leading-relaxed text-sm sm:text-base">
                    網路世界中充滿各種誘人的工作機會與熱情的陌生私訊。請從左側（或下方）選擇一個情境開始模擬對話，練習辨識陷阱並做出最安全的決定！
                </p>
                <div class="flex flex-wrap gap-3 justify-center">
                    <button type="button" data-action="start-scenario" data-scenario="job" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-600/20 transition-all flex items-center gap-2">
                        <i data-lucide="play" class="w-4 h-4"></i> 開始體驗「求職詐騙」
                    </button>
                    <button type="button" data-action="start-scenario" data-scenario="social" class="px-6 py-3 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 font-semibold rounded-2xl transition-all flex items-center gap-2">
                        <i data-lucide="play" class="w-4 h-4"></i> 開始體驗「交友詐騙」
                    </button>
                </div>
            </div>

            <!-- 聊天室主體 (選擇情境後顯示) -->
            <div id="chat-container" class="hidden flex-1 flex flex-col h-full overflow-hidden">
                <!-- 聊天室頂部聯絡人資訊欄 -->
                <header class="bg-white px-5 py-3.5 border-b border-slate-200 flex items-center justify-between shrink-0 shadow-sm z-10">
                    <div class="flex items-center gap-3">
                        <div id="contact-avatar" class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-lg shrink-0">
                            ?
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 id="contact-name" class="font-bold text-slate-800 text-sm sm:text-base">聯絡人名稱</h3>
                                <span id="contact-tag" class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-medium">陌生帳號</span>
                            </div>
                            <p id="contact-bio" class="text-xs text-slate-500">帳號簡介資訊</p>
                        </div>
                    </div>
                    <!-- 檢視帳號破綻按鈕 -->
                    <button type="button" id="btn-inspect-profile" data-action="inspect-profile" class="px-3 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 text-xs font-semibold flex items-center gap-1.5 transition-all relative">
                        <span id="inspect-ping" class="hidden absolute -top-1 -right-1 flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
                        </span>
                        <i data-lucide="search" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">檢查帳號資訊</span>
                        <span class="sm:hidden">查帳號</span>
                    </button>
                </header>

                <!-- 訊息對話紀錄區 -->
                <div id="messages-area" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 bg-[#f8fafc]">
                    <!-- 動態插入訊息氣泡與提示卡片 -->
                </div>

                <!-- 對方正在輸入提示 -->
                <div id="typing-indicator" class="hidden px-6 py-2 bg-[#f8fafc] text-xs text-slate-400 flex items-center gap-2">
                    <div class="bg-white border border-slate-200 px-3 py-2 rounded-2xl rounded-bl-none flex items-center gap-1 shadow-sm">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span>
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span>
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span>
                    </div>
                    <span>對方正在輸入訊息...</span>
                </div>

                <!-- 底部玩家回覆選項區 -->
                <div id="choices-area" class="bg-white border-t border-slate-200 p-4 shrink-0">
                    <p class="text-xs font-semibold text-slate-400 mb-2.5 flex items-center gap-1.5">
                        <i data-lucide="corner-down-right" class="w-3.5 h-3.5 text-indigo-500"></i> 請選擇你的回應方式：
                    </p>
                    <div id="choices-buttons" class="space-y-2">
                        <!-- 動態生成選項按鈕 -->
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- 彈出視窗：帳號背景調查 / 系統解析 / 結算報告 -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 animate-msg max-h-[88vh] overflow-y-auto">
            <div id="modal-content">
                <!-- 動態填入彈窗內容 -->
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 劇本資料庫設計 (求職詐騙 & 社群交友詐騙)
        // ==========================================
        const scenarios = {
            job: {
                id: 'job',
                title: '情境一：高薪居家打工',
                contactName: '林專員｜星光數位行銷',
                contactTag: 'IG 限動廣告帳號',
                contactBio: '居家兼職｜時間彈性｜免經驗日領現',
                avatarText: '林',
                avatarColor: 'bg-amber-100 text-amber-700',
                profileClues: [
                    '帳號成立時間僅 2 週，貼文全是名車、鈔票與「感謝老師帶我賺錢」的對話截圖。',
                    '沒有提供任何公司統一編號、實體地址或官方網站。',
                    '要求離開原本的社群平台，改用加密通訊軟體（如 Telegram 或特定 LINE 群）聯繫。'
                ],
                startStep: 'step1',
                steps: {
                    step1: {
                        incoming: [
                            '哈囉同學！看到你私訊詢問「居家聽歌打字員」的職缺對吧？😊',
                            '我們的工作超簡單，只要在家用手機聽指定歌曲、打 50 字心得，一單現領 500 元，每天花 1 小時輕鬆日賺 2,000～3,000 元！完全免經驗、不收任何報名費喔！'
                        ],
                        redFlag: '【話術警訊：不合理的高薪與低門檻】打字、聽歌等無專業門檻的工作卻開出「日薪數千元」，明顯違反市場行情，這是吸引學生上鉤的典型誘餌。',
                        choices: [
                            {
                                text: '哇！聽起來也太好賺了吧！請問要怎麼開始？',
                                scoreDelta: -15,
                                feedbackType: 'warning',
                                feedback: '太快表現出渴望賺錢的心態，容易讓詐騙集團鎖定你為「高成功率目標」。建議先查證公司背景！',
                                nextStep: 'step2'
                            },
                            {
                                text: '聽起來待遇很好，請問你們公司的全名和統一編號是什麼？有實體辦公室嗎？',
                                scoreDelta: 0,
                                feedbackType: 'good',
                                feedback: '做得好！主動查證公司行號與統編是求職的第一道防線。看看對方如何閃躲這個問題。',
                                nextStep: 'step2_deflect'
                            },
                            {
                                text: '這明顯是詐騙吧，世上沒有這麼好康的事。（直接封鎖）',
                                scoreDelta: 10,
                                feedbackType: 'safe',
                                feedback: '敏銳度很高！一眼看穿不合理高薪陷阱並果斷封鎖，成功避開風險！',
                                isEnding: true,
                                endingTitle: '成功識破！果斷拒絕高薪誘餌',
                                endingSummary: '你在第一時間就察覺到「低門檻、超高薪」的矛盾，沒有給詐騙集團任何進一步洗腦的機會。'
                            }
                        ]
                    },
                    step2_deflect: {
                        incoming: [
                            '我們是跟各大唱片公司合作的「線上外包工作室」，為了節省辦公室租金才全部居家辦公，所以沒有對外開放的門市喔～',
                            '現在名額只剩最後 2 個！要應徵的話請先加我們派單主任的 LINE，並提供你的「姓名、電話、身分證字號」以及「銀行存摺封面」方便後續匯薪水給你！'
                        ],
                        redFlag: '【重大警訊：未錄取先索取個資與存摺】正規公司只會在「正式錄取報到後」才請員工提供薪轉帳戶，絕不會在面試前就要身分證與存摺拍照！',
                        choices: [
                            {
                                text: '好喔，那我現在拍身分證跟存摺封面傳過去，怕名額被搶走！',
                                scoreDelta: -45,
                                feedbackType: 'danger',
                                feedback: '極度危險！交出存摺與身分證，你的帳戶極可能淪為詐騙集團的「人頭帳戶」，不僅會變警示帳戶，還可能背上詐欺刑責！',
                                nextStep: 'step3_trap'
                            },
                            {
                                text: '還沒正式錄取就要身分證跟存摺太奇怪了，我不能提供這些資料。',
                                scoreDelta: 5,
                                feedbackType: 'good',
                                feedback: '非常正確的判斷！堅守個資底線能保護你不成為人頭帳戶受害者。',
                                nextStep: 'step3_push'
                            }
                        ]
                    },
                    step2: {
                        incoming: [
                            '名額很搶手喔！現在只剩最後 2 個缺額～',
                            '要幫你保留名額的話，請先傳送你的「身分證正反面照片」和「銀行存摺封面」給我建檔，這樣你完成任務我們才能馬上匯款給你！'
                        ],
                        redFlag: '【重大警訊：未錄取先索取個資與存摺】正規企業絕不會在網路私訊階段要求傳送身分證正反面與存摺封面！',
                        choices: [
                            {
                                text: '好，我馬上拍給你！（傳送證件與存摺照片）',

                                feedback: '太可惜了！明明已經用「要求語音」測試出對方不敢講話的破綻，卻在最後一刻心軟匯款，錢已經被轉進人頭帳戶了！',
                                isEnding: true,
                                endingTitle: '功虧一簣！在最後關頭心軟匯款',
                                endingSummary: '記住鐵則：在網路上借錢給親友，沒有「親耳聽到聲音」或「親眼見到本人」之前，一毛錢都不能轉出！'
                            }
                        ]
                    }
                }
            }
        };

        // ==========================================
        // 2. 狀態管理與核心互動邏輯
        // ==========================================
        let currentScenario = null;
        let currentStepId = null;
        let safetyScore = 100;
        let hasInspectedCurrentProfile = false; // 追蹤目前關卡是否已閱讀過「檢查帳號資訊」
        const completedScenarios = new Set();
        const scenarioScores = {}; // 紀錄各關卡最終得分
        const scenarioHistory = {}; // 保存各關卡完成時的對話紀錄 HTML、最終分數與結局資料
        const scenarioOrder = ['job', 'social', 'order', 'model', 'friend'];

        let endingCountdownInterval = null;
        let endingAutoModalTimeout = null;
        let messageRenderTimeouts = [];

        function safeCreateIcons() {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        function clearEndingTimers() {
            if (endingCountdownInterval) {
                clearInterval(endingCountdownInterval);
                endingCountdownInterval = null;
            }
            if (endingAutoModalTimeout) {
                clearTimeout(endingAutoModalTimeout);
                endingAutoModalTimeout = null;
            }
            messageRenderTimeouts.forEach(t => clearTimeout(t));
            messageRenderTimeouts = [];
        }

        function getNextScenarioKey(currentKey) {
            const uncompleted = scenarioOrder.find(k => k !== currentKey && !completedScenarios.has(k));
            if (uncompleted) return uncompleted;
            const currentIndex = scenarioOrder.indexOf(currentKey);
            return scenarioOrder[(currentIndex + 1) % scenarioOrder.length];
        }

        function updateSafetyUI() {
            safetyScore = Math.max(0, Math.min(100, safetyScore));
            const barEl = document.getElementById('safety-bar');
            const textEl = document.getElementById('safety-score-text');
            const descEl = document.getElementById('safety-status-desc');
            if (!barEl || !textEl || !descEl) return;

            barEl.style.width = `${safetyScore}%`;
            textEl.textContent = `${safetyScore} / 100`;

            barEl.classList.remove('bg-emerald-400', 'bg-amber-400', 'bg-rose-500');
            textEl.classList.remove('text-emerald-400', 'text-amber-400', 'text-rose-400');

            if (safetyScore >= 80) {
                barEl.classList.add('bg-emerald-400');
                textEl.classList.add('text-emerald-400');
                descEl.textContent = '警覺性極佳！持續保持查證習慣。';
            } else if (safetyScore >= 50) {
                barEl.classList.add('bg-amber-400');
                textEl.classList.add('text-amber-400');
                descEl.textContent = '出現風險警訊！請務必提高警覺並再三查證。';
            } else {
                barEl.classList.add('bg-rose-500');
                textEl.classList.add('text-rose-400');
                descEl.textContent = '高度危險！極可能遭受財產損失或成為人頭帳戶！';
            }
        }

        function startScenario(scenarioKey, forceRestart = false) {
            clearEndingTimers();
            currentScenario = scenarios[scenarioKey];
            if (!currentScenario) return;

            // 更新左側情境按鈕高亮狀態
            scenarioOrder.forEach(key => {
                const btn = document.getElementById(`btn-scenario-${key}`);
                if (btn) {
                    if (key === scenarioKey) {
                        btn.classList.add('bg-slate-800', 'border-indigo-500/60');
                        btn.classList.remove('border-transparent');
                    } else {
                        btn.classList.remove('bg-slate-800', 'border-indigo-500/60');
                        btn.classList.add('border-transparent');
                    }
                }
            });

            // 切換右側畫面
            document.getElementById('welcome-screen').classList.add('hidden');
            const chatContainer = document.getElementById('chat-container');
            chatContainer.classList.remove('hidden');
            chatContainer.classList.add('flex');

            // 設定聯絡人資訊
            const avatarEl = document.getElementById('contact-avatar');
            avatarEl.textContent = currentScenario.avatarText;
            avatarEl.className = `w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shrink-0 ${currentScenario.avatarColor}`;
            document.getElementById('contact-name').textContent = currentScenario.contactName;
            document.getElementById('contact-tag').textContent = currentScenario.contactTag;
            document.getElementById('contact-bio').textContent = currentScenario.contactBio;
            document.getElementById('typing-indicator').classList.add('hidden');

            // 若該關卡已完成且非強制重新開始，直接還原上次作答對話並跳出本關結算結果
            if (!forceRestart && completedScenarios.has(scenarioKey) && scenarioHistory[scenarioKey]) {
                const saved = scenarioHistory[scenarioKey];
                hasInspectedCurrentProfile = true;
                safetyScore = saved.finalScore;
                updateSafetyUI();

                // 取消右上角閃爍提醒
                const inspectBtn = document.getElementById('btn-inspect-profile');
                const inspectPing = document.getElementById('inspect-ping');
                if (inspectBtn) inspectBtn.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-100');
                if (inspectPing) inspectPing.classList.add('hidden');

                // 還原當時完整的對話紀錄與底部控制列
                const msgArea = document.getElementById('messages-area');
                msgArea.innerHTML = saved.messagesHtml;
                msgArea.scrollTop = msgArea.scrollHeight;
                safeCreateIcons();

                renderEndingControls(saved.endingChoice, false);
                showEndingModal(saved.endingChoice);
                return;
            }

            currentStepId = currentScenario.startStep;
            safetyScore = 100;
            hasInspectedCurrentProfile = false;
            updateSafetyUI();

            // 高亮提示右上角「檢查帳號資訊」按鈕
            const inspectBtn = document.getElementById('btn-inspect-profile');
            const inspectPing = document.getElementById('inspect-ping');
            if (inspectBtn) {
                inspectBtn.classList.add('ring-2', 'ring-amber-400', 'bg-amber-100');
            }
            if (inspectPing) {
                inspectPing.classList.remove('hidden');
            }

            // 清空舊對話
            document.getElementById('messages-area').innerHTML = '';

            // 系統提示橫幅與強制先查帳號引導卡片
            appendSystemBanner(`已進入「${currentScenario.title}」`);
            appendPreCheckGate();
        }

        // 強制先檢查帳號資訊的引導門檻
        function appendPreCheckGate() {
            const msgArea = document.getElementById('messages-area');
            const choicesArea = document.getElementById('choices-area');
            const container = document.getElementById('choices-buttons');

            const gateDiv = document.createElement('div');
            gateDiv.id = 'pre-check-gate-card';
            gateDiv.className = 'mx-auto max-w-md bg-amber-50 border border-amber-300 rounded-2xl p-4 text-center shadow-sm animate-msg';
            gateDiv.innerHTML = `
                <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center mx-auto mb-2.5">
                    <i data-lucide="search-check" class="w-5 h-5"></i>
                </div>
                <h4 class="font-bold text-amber-900 text-sm mb-1">安全第一關：先查證帳號背景！</h4>
                <p class="text-xs text-amber-800 leading-relaxed mb-3">
                    在開始回覆陌生或可疑私訊前，請先點擊右上角的<strong>「檢查帳號資訊」</strong>按鈕（或下方按鈕），檢視對方的帳號異常線索。
                </p>
                <button type="button" data-action="inspect-profile" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-semibold text-xs rounded-xl transition-colors inline-flex items-center gap-1.5 shadow-sm">
                    <i data-lucide="search" class="w-3.5 h-3.5"></i> 立即檢查帳號資訊
                </button>
            `;
            msgArea.appendChild(gateDiv);
            msgArea.scrollTop = msgArea.scrollHeight;

            const headerLabel = choicesArea.querySelector('p');
            if (headerLabel) {
                headerLabel.innerHTML = `<i data-lucide="lock" class="w-3.5 h-3.5 text-amber-500"></i> 請先閱讀右上角「檢查帳號資訊」後解鎖對話：`;
            }
            container.innerHTML = `
                <button type="button" data-action="inspect-profile" class="w-full py-2.5 px-4 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 rounded-xl font-semibold text-xs sm:text-sm transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="search" class="w-4 h-4"></i> 點我開啟「檢查帳號資訊」開始挑戰
                </button>
            `;
            choicesArea.classList.remove('hidden', 'opacity-50', 'pointer-events-none');
            safeCreateIcons();
        }

        // 渲染指定步驟的對方訊息與選項
        function renderStep(stepId) {
            const step = currentScenario.steps[stepId];
            if (!step) return;

            const choicesArea = document.getElementById('choices-area');
            const typingEl = document.getElementById('typing-indicator');
            const headerLabel = choicesArea.querySelector('p');
            if (headerLabel) {
                headerLabel.innerHTML = `<i data-lucide="corner-down-right" class="w-3.5 h-3.5 text-indigo-500"></i> 請選擇你的回應方式：`;
            }

            // 對方輸入訊息期間，先隱藏底部選項區塊
            choicesArea.classList.add('hidden');
            typingEl.classList.remove('hidden');

            const messages = step.incoming || [];
            messages.forEach((text, index) => {
                const t = setTimeout(() => {
                    appendIncomingMessage(text);
                    if (index === messages.length - 1) {
                        typingEl.classList.add('hidden');
                        if (step.redFlag) {
                            appendRedFlagCard(step.redFlag);
                        }
                        renderChoices(step.choices);
                        // 對方訊息全數跳出後，再顯示新的選項區塊
                        choicesArea.classList.remove('hidden', 'opacity-50', 'pointer-events-none');
                        choicesArea.classList.add('animate-msg');
                    }
                }, (index + 1) * 650);
                messageRenderTimeouts.push(t);
            });
        }

        function appendSystemBanner(text) {
            const msgArea = document.getElementById('messages-area');
            const div = document.createElement('div');
            div.className = 'text-center my-2 animate-msg';
            div.innerHTML = `<span class="inline-block px-3 py-1 rounded-full bg-slate-200/80 text-slate-600 text-[11px] font-medium">${text}</span>`;
            msgArea.appendChild(div);
            msgArea.scrollTop = msgArea.scrollHeight;
        }

        function appendIncomingMessage(text) {
            const msgArea = document.getElementById('messages-area');
            const wrapper = document.createElement('div');
            wrapper.className = 'flex items-end gap-2.5 animate-msg';
            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shrink-0 ${currentScenario.avatarColor}">
                    ${currentScenario.avatarText}
                </div>
                <div class="bg-white border border-slate-200 text-slate-800 px-4 py-3 rounded-2xl rounded-bl-none shadow-sm max-w-[85%] sm:max-w-[78%] text-sm leading-relaxed">
                    ${text}
                </div>
            `;
            msgArea.appendChild(wrapper);
            msgArea.scrollTop = msgArea.scrollHeight;
        }

        function appendOutgoingMessage(text) {
            const msgArea = document.getElementById('messages-area');
            const wrapper = document.createElement('div');
            wrapper.className = 'flex justify-end animate-msg';
            wrapper.innerHTML = `
                <div class="bg-indigo-600 text-white px-4 py-3 rounded-2xl rounded-br-none shadow-sm max-w-[85%] sm:max-w-[78%] text-sm leading-relaxed">
                    ${text}
                </div>
            `;
            msgArea.appendChild(wrapper);
            msgArea.scrollTop = msgArea.scrollHeight;
        }

        function appendRedFlagCard(flagText) {
            const msgArea = document.getElementById('messages-area');
            const card = document.createElement('div');
            card.className = 'bg-amber-50/90 border-l-4 border-amber-500 rounded-r-2xl p-3.5 text-xs text-amber-900 leading-relaxed shadow-sm animate-msg max-w-[92%] sm:max-w-[85%]';
            card.innerHTML = `
                <div class="flex items-start gap-2">
                    <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
                    <div>${flagText}</div>
                </div>
            `;
            msgArea.appendChild(card);
            msgArea.scrollTop = msgArea.scrollHeight;
            safeCreateIcons();
        }

        function appendFeedbackCard(choice) {
            const msgArea = document.getElementById('messages-area');
            const styles = {
                safe: { bg: 'bg-emerald-50 border-emerald-500 text-emerald-900', icon: 'shield-check', iconColor: 'text-emerald-600', label: '安全判斷' },
                good: { bg: 'bg-sky-50 border-sky-500 text-sky-900', icon: 'thumbs-up', iconColor: 'text-sky-600', label: '警覺回應' },
                warning: { bg: 'bg-amber-50 border-amber-500 text-amber-900', icon: 'alert-circle', iconColor: 'text-amber-600', label: '風險提醒' },
                danger: { bg: 'bg-rose-50 border-rose-500 text-rose-900', icon: 'shield-alert', iconColor: 'text-rose-600', label: '高風險行為' }
            };
            const st = styles[choice.feedbackType] || styles.warning;
            const deltaText = choice.scoreDelta > 0 ? `+${choice.scoreDelta} 分` : (choice.scoreDelta < 0 ? `${choice.scoreDelta} 分` : '0 分');

            const card = document.createElement('div');
            card.className = `${st.bg} border-l-4 rounded-r-2xl p-3.5 text-xs leading-relaxed shadow-sm animate-msg max-w-[92%] sm:max-w-[85%] ml-auto`;
            card.innerHTML = `
                <div class="flex items-start gap-2">
                    <i data-lucide="${st.icon}" class="w-4 h-4 ${st.iconColor} shrink-0 mt-0.5"></i>
                    <div>
                        <div class="font-bold mb-0.5">${st.label}（安全指數 ${deltaText}）</div>
                        <div>${choice.feedback}</div>
                    </div>
                </div>
            `;
            msgArea.appendChild(card);
            msgArea.scrollTop = msgArea.scrollHeight;
            safeCreateIcons();
        }

        function renderChoices(choices) {
            const container = document.getElementById('choices-buttons');
            container.innerHTML = '';
            (choices || []).forEach(choice => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'w-full text-left p-3 rounded-xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/60 text-xs sm:text-sm text-slate-700 font-medium transition-all flex items-start gap-2.5 group';
                btn.innerHTML = `
                    <span class="w-5 h-5 rounded-full bg-slate-100 group-hover:bg-indigo-600 group-hover:text-white text-slate-500 flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 transition-colors">›</span>
                    <span class="leading-relaxed">${choice.text}</span>
                `;
                btn.addEventListener('click', () => handleChoice(choice));
                container.appendChild(btn);
            });
            safeCreateIcons();
        }

        function handleChoice(choice) {
            appendOutgoingMessage(choice.text);
            safetyScore += choice.scoreDelta;
            updateSafetyUI();
            appendFeedbackCard(choice);

            if (choice.isEnding) {
                completedScenarios.add(currentScenario.id);
                // 紀錄該關卡得分（若重複挑戰則保留最高分）
                const prevScore = scenarioScores[currentScenario.id];
                scenarioScores[currentScenario.id] = prevScore !== undefined ? Math.max(prevScore, safetyScore) : safetyScore;

                // 保存本次完整作答紀錄與結果，供第二次點擊側邊選項時直接檢視
                scenarioHistory[currentScenario.id] = {
                    messagesHtml: document.getElementById('messages-area').innerHTML,
                    finalScore: safetyScore,
                    endingChoice: choice
                };

                const badge = document.getElementById(`badge-${currentScenario.id}`);
                if (badge) {
                    badge.textContent = `${scenarioScores[currentScenario.id]}分`;
                    badge.classList.remove('hidden');
                }

                // 若 5 個情境皆已完成，顯示左側總結算快捷按鈕
                if (completedScenarios.size === scenarioOrder.length) {
                    const banner = document.getElementById('final-summary-banner');
                    if (banner) banner.classList.remove('hidden');
                }

                // 準備背景控制列，並立即跳出本關結算畫面
                renderEndingControls(choice, false);
                showEndingModal(choice);
            } else if (choice.nextStep) {
                currentStepId = choice.nextStep;
                renderStep(currentStepId);
            }
        }

        // 在對話底部渲染「停留閱讀倒數（60秒）」與「手動繼續挑戰下一關」控制列
        function renderEndingControls(choice, startCountdown = false) {
            clearEndingTimers();
            const choicesArea = document.getElementById('choices-area');
            const container = document.getElementById('choices-buttons');
            const allCompleted = completedScenarios.size === scenarioOrder.length;
            const otherScenarioKey = getNextScenarioKey(currentScenario.id);
            const otherScenarioTitle = scenarios[otherScenarioKey].title;
            let remainingSeconds = 60;

            const headerLabel = choicesArea.querySelector('p');
            if (headerLabel) {
                headerLabel.innerHTML = startCountdown
                    ? `<i data-lucide="clock" class="w-3.5 h-3.5 text-emerald-600"></i> <span id="ending-countdown-label">停留回顧中：畫面將停留 <strong>60</strong> 秒供回顧對話，或隨時手動切換：</span>`
                    : `<i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-600"></i> <span id="ending-countdown-label">本關已完成！可隨時回顧對話、查看結算或挑戰下一關：</span>`;
            }

            const primaryBtnHtml = allCompleted
                ? `<button type="button" id="btn-final-summary" class="flex-1 py-2.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white rounded-xl font-bold text-xs sm:text-sm transition-colors flex items-center justify-center gap-1.5 shadow-sm">
                        <i data-lucide="trophy" class="w-4 h-4"></i> 完成全 5 關！查看綜合安全指數
                   </button>`
                : `<button type="button" id="btn-next-stage" class="flex-1 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold text-xs sm:text-sm transition-colors flex items-center justify-center gap-1.5 shadow-sm">
                        繼續挑戰：${otherScenarioTitle} <i data-lucide="arrow-right" class="w-4 h-4"></i>
                   </button>`;

            container.innerHTML = `
                <div class="flex flex-col sm:flex-row gap-2 pt-1">
                    ${primaryBtnHtml}
                    <button type="button" id="btn-view-report" class="py-2.5 px-4 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-xl font-semibold text-xs sm:text-sm transition-colors flex items-center justify-center gap-1.5">
                        <i data-lucide="file-check-2" class="w-4 h-4"></i> 本關結算
                    </button>
                    <button type="button" id="btn-retry-stage" class="py-2.5 px-4 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded-xl font-semibold text-xs sm:text-sm transition-colors flex items-center justify-center gap-1.5">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> 重新挑戰
                    </button>
                </div>
            `;

            choicesArea.classList.remove('hidden', 'opacity-50', 'pointer-events-none');
            safeCreateIcons();

            if (allCompleted) {
                document.getElementById('btn-final-summary').addEventListener('click', () => {
                    clearEndingTimers();
                    showFinalSummaryModal();
                });
            } else {
                document.getElementById('btn-next-stage').addEventListener('click', () => {
                    clearEndingTimers();
                    startScenario(otherScenarioKey);
                });
            }

            document.getElementById('btn-view-report').addEventListener('click', () => {
                clearEndingTimers();
                showEndingModal(choice);
            });
            document.getElementById('btn-retry-stage').addEventListener('click', () => {
                clearEndingTimers();
                startScenario(currentScenario.id, true);
            });

            if (startCountdown) {
                endingCountdownInterval = setInterval(() => {
                    remainingSeconds -= 1;
                    const labelEl = document.getElementById('ending-countdown-label');
                    if (labelEl) {
                        if (remainingSeconds > 0) {
                            labelEl.innerHTML = `停留回顧中：畫面將停留 <strong>${remainingSeconds}</strong> 秒供回顧對話，或隨時手動切換：`;
                        } else {
                            labelEl.innerHTML = allCompleted
                                ? `停留時間結束，已為你開啟全 5 關綜合安全指數報告：`
                                : `停留時間結束，已為你開啟結算報告（仍可隨時切換關卡）：`;
                        }
                    }
                    if (remainingSeconds <= 0) {
                        clearEndingTimers();
                        if (allCompleted) {
                            showFinalSummaryModal();
                        } else {
                            showEndingModal(choice);
                        }
                    }
                }, 1000);
            }
        }

        // ==========================================
        // 3. 彈出視窗功能 (帳號偵查 / 結局結算 / 全關卡總結算 / 防詐錦囊)
        // ==========================================
        function openModal(htmlContent) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.innerHTML = htmlContent;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            safeCreateIcons();
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        function showFinalSummaryModal() {
            const totalMax = scenarioOrder.length * 100;
            const totalEarned = scenarioOrder.reduce((sum, key) => sum + (scenarioScores[key] ?? 0), 0);
            const overallRate = Math.round((totalEarned / totalMax) * 100);

            let rankTitle = '';
            let rankBadgeClass = '';
            let scoreBoxClass = '';
            let scoreNumberClass = '';
            let rankAdvice = '';

            if (overallRate >= 90) {
                rankTitle = 'SSS 級・校園反詐守護神';
                rankBadgeClass = 'bg-emerald-100 text-emerald-700 border-emerald-200';
                scoreBoxClass = 'bg-gradient-to-br from-emerald-50 to-teal-50 border-emerald-300';
                scoreNumberClass = 'text-emerald-600';
                rankAdvice = '太強了！你具備極高的數位敏銳度與邊界感，不僅能精準識破求職、投資與網拍陷阱，還能保護身邊親友不被詐騙！';
            } else if (overallRate >= 75) {
                rankTitle = 'A 級・防詐警覺者';
                rankBadgeClass = 'bg-sky-100 text-sky-700 border-sky-200';
                scoreBoxClass = 'bg-gradient-to-br from-sky-50 to-indigo-50 border-sky-300';
                scoreNumberClass = 'text-sky-600';
                rankAdvice = '表現很不錯！大多數情況下你都能守住底線，但面對「前期小利誘惑」或「親友緊急請求」時，記得再多一秒鐘查證喔！';
            } else if (overallRate >= 50) {
                rankTitle = 'B 級・容易心軟的潛在目標';
                rankBadgeClass = 'bg-amber-100 text-amber-700 border-amber-200';
                scoreBoxClass = 'bg-gradient-to-br from-amber-50 to-orange-50 border-amber-300';
                scoreNumberClass = 'text-amber-600';
                rankAdvice = '要小心喔！你在部分情境中容易受到「高薪、限時名額或情緒勒索」影響。切記：不繳錢、不給證件帳戶、不拍私密照！';
            } else {
                rankTitle = 'C 級・高風險待加強防線';
                rankBadgeClass = 'bg-rose-100 text-rose-700 border-rose-200';
                scoreBoxClass = 'bg-gradient-to-br from-rose-50 to-red-50 border-rose-300';
                scoreNumberClass = 'text-rose-600';
                rankAdvice = '警報響起！你非常容易落入詐騙話術圈套。建議重新挑戰得分較低的關卡，遇到任何要求匯款或個資的訊息，務必先撥打 165 諮詢！';
            }

            const breakdownHtml = scenarioOrder.map(key => {
                const sc = scenarios[key];
                const score = scenarioScores[key] ?? 0;
                const scoreColor = score >= 80 ? 'text-emerald-600' : (score >= 50 ? 'text-amber-600' : 'text-rose-600');
                return `
                    <div class="flex items-center justify-between py-2 px-3 rounded-xl bg-slate-50 border border-slate-200/80 text-xs">
                        <span class="font-medium text-slate-700">${sc.title}</span>
                        <span class="font-bold ${scoreColor}">${score} / 100 分</span>
                    </div>
                `;
            }).join('');

            openModal(`
                <div class="text-center mb-4">
                    <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white flex items-center justify-center mb-2.5 shadow-lg shadow-emerald-500/25">
                        <i data-lucide="trophy" class="w-7 h-7"></i>
                    </div>
                    <span class="inline-block text-xs font-bold px-3 py-1 rounded-full border ${rankBadgeClass}">
                        ${rankTitle}
                    </span>

                    <!-- 醒目放大版綜合安全指數總分數區塊 -->
                    <div class="mt-3 p-4 rounded-2xl border-2 ${scoreBoxClass} shadow-sm">
                        <p class="text-xs font-bold text-slate-500 tracking-wider uppercase mb-1">綜合個人安全指數</p>
                        <div class="flex items-baseline justify-center gap-1.5">
                            <span class="text-5xl sm:text-6xl font-extrabold tracking-tight ${scoreNumberClass}">${overallRate}</span>
                            <span class="text-2xl font-bold ${scoreNumberClass}">%</span>
                        </div>
                        <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/90 border border-slate-200/80 text-sm font-bold text-slate-700">
                            <span>五關累計總得分：</span>
                            <span class="text-base font-extrabold ${scoreNumberClass}">${totalEarned}</span>
                            <span class="text-xs text-slate-400">/ ${totalMax} 分</span>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-50 rounded-2xl p-3.5 border border-slate-200 text-xs text-slate-700 leading-relaxed mb-4">
                    ${rankAdvice}
                </div>

                <div class="space-y-1.5 mb-5">
                    <p class="text-xs font-bold text-slate-500 px-1">各情境防禦表現明細：</p>
                    ${breakdownHtml}
                </div>

                <div class="flex flex-col sm:flex-row gap-2.5">
                    <button type="button" data-action="close-modal" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-semibold text-sm transition-colors">
                        返回對話畫面
                    </button>
                    <button type="button" id="btn-reset-all-progress" class="flex-1 py-2.5 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded-xl font-semibold text-sm transition-colors flex items-center justify-center gap-1.5">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> 全部重新挑戰
                    </button>
                </div>
            `);

            document.getElementById('btn-reset-all-progress').addEventListener('click', () => {
                completedScenarios.clear();
                scenarioOrder.forEach(k => {
                    delete scenarioScores[k];
                    delete scenarioHistory[k];
                    const b = document.getElementById(`badge-${k}`);
                    if (b) {
                        b.textContent = '已完成';
                        b.classList.add('hidden');
                    }
                });
                const banner = document.getElementById('final-summary-banner');
                if (banner) banner.classList.add('hidden');
                closeModal();
                startScenario('job', true);
            });
        }

        function inspectProfile() {
            if (!currentScenario) return;
            const cluesHtml = currentScenario.profileClues.map(clue => `
                <li class="flex items-start gap-2.5 text-sm text-slate-700 bg-rose-50/70 p-3 rounded-xl border border-rose-100">
                    <i data-lucide="alert-circle" class="w-4 h-4 text-rose-500 shrink-0 mt-0.5"></i>
                    <span>${clue}</span>
                </li>
            `).join('');

            const isFirstUnlock = !hasInspectedCurrentProfile;

            openModal(`
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2.5">
                        <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center">
                            <i data-lucide="search" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">帳號背景偵查報告</h3>
                            <p class="text-xs text-slate-500">對象：${currentScenario.contactName}</p>
                        </div>
                    </div>
                    <button type="button" data-action="close-modal" class="text-slate-400 hover:text-slate-600 p-1">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">系統偵測到的可疑破綻：</p>
                <ul class="space-y-2.5 mb-6">
                    ${cluesHtml}
                </ul>
                <button type="button" id="btn-confirm-inspect" data-action="close-modal" class="w-full py-3 ${isFirstUnlock ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-slate-800 hover:bg-slate-700'} text-white rounded-xl font-semibold text-sm transition-colors">
                    ${isFirstUnlock ? '我已掌握線索，開始對話！' : '我了解了，返回對話'}
                </button>
            `);

            // 若為初次檢視，閱讀完畢後解鎖對話流程
            if (isFirstUnlock) {
                hasInspectedCurrentProfile = true;
                const inspectBtn = document.getElementById('btn-inspect-profile');
                const inspectPing = document.getElementById('inspect-ping');
                if (inspectBtn) {
                    inspectBtn.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-100');
                }
                if (inspectPing) {
                    inspectPing.classList.add('hidden');
                }
                const gateCard = document.getElementById('pre-check-gate-card');
                if (gateCard) {
                    gateCard.remove();
                }
                appendSystemBanner('已完成帳號背景查證，對話正式開始');
                renderStep(currentStepId);
            }
        }

        function showEndingModal(choice) {
            const isSafe = safetyScore >= 70;
            const otherScenarioKey = getNextScenarioKey(currentScenario.id);
            const otherScenarioName = scenarios[otherScenarioKey].title;
            const allCompleted = completedScenarios.size === scenarioOrder.length;

            const actionBtnHtml = allCompleted
                ? `<button type="button" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white rounded-xl font-bold text-sm transition-colors flex items-center justify-center gap-2" id="modal-final-btn">
                        <i data-lucide="trophy" class="w-4 h-4"></i> 繼續查看全 5 關綜合個人安全指數
                   </button>`
                : `<button type="button" data-action="close-modal" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold text-sm transition-colors flex items-center justify-center gap-2" id="modal-next-btn">
                        繼續挑戰「${otherScenarioName}」 <i data-lucide="arrow-right" class="w-4 h-4"></i>
                   </button>`;

            openModal(`
                <div class="text-center mb-5">
                    <div class="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center mb-3 ${isSafe ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                        <i data-lucide="${isSafe ? 'award' : 'shield-alert'}" class="w-9 h-9"></i>
                    </div>
                    <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-full ${isSafe ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                        本關安全指數：${safetyScore} 分（進度 ${completedScenarios.size} / ${scenarioOrder.length} 關）
                    </span>
                    <h3 class="font-bold text-xl text-slate-800 mt-3">${choice.endingTitle}</h3>
                </div>
                <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200 text-sm text-slate-700 leading-relaxed mb-5">
                    ${choice.endingSummary}
                </div>
                <div class="space-y-2.5">
                    ${actionBtnHtml}
                    <button type="button" id="modal-stay-review-btn" class="w-full py-2.5 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 rounded-xl font-semibold text-sm transition-colors flex items-center justify-center gap-2">
                        <i data-lucide="clock" class="w-4 h-4"></i> 停留畫面 1 分鐘回顧對話
                    </button>
                    <button type="button" data-action="close-modal" class="w-full py-2.5 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded-xl font-semibold text-sm transition-colors flex items-center justify-center gap-2" id="modal-retry-btn">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> 重新體驗本情境
                    </button>
                </div>
            `);

            if (allCompleted) {
                document.getElementById('modal-final-btn').addEventListener('click', () => {
                    showFinalSummaryModal();
                });
            } else {
                document.getElementById('modal-next-btn').addEventListener('click', () => {
                    startScenario(otherScenarioKey);
                });
            }
            document.getElementById('modal-stay-review-btn').addEventListener('click', () => {
                closeModal();
                renderEndingControls(choice, true);
            });
            document.getElementById('modal-retry-btn').addEventListener('click', () => {
                startScenario(currentScenario.id, true);
            });
        }

        function toggleGuideModal(show) {
            if (!show) {
                closeModal();
                return;
            }
            openModal(`
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2.5">
                        <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center">
                            <i data-lucide="book-open-check" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">青少年反詐防身錦囊</h3>
                            <p class="text-xs text-slate-500">記住「三不五要」原則，遠離網路陷阱</p>
                        </div>
                    </div>
                    <button type="button" data-action="close-modal" class="text-slate-400 hover:text-slate-600 p-1">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="space-y-3 text-sm text-slate-700 mb-6">
                    <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
                        <h4 class="font-bold text-indigo-700 mb-1">1. 求職防詐「七不原則」</h4>
                        <p class="text-xs text-slate-600 leading-relaxed">不繳錢、不購買、不辦卡、不隨意簽約、證件不離身（不傳身分證與存摺封面）、不飲用不明飲料、不非法工作。</p>
                    </div>
                    <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
                        <h4 class="font-bold text-rose-700 mb-1">2. 社群交友「零金錢往來」</h4>
                        <p class="text-xs text-slate-600 leading-relaxed">凡是網友提到「穩賺不賠投資」、「代墊刷單」、「借用銀行帳戶」或教唆對超商店員說謊，100% 是詐騙。</p>
                    </div>
                    <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
                        <h4 class="font-bold text-emerald-700 mb-1">3. 懷疑受騙立刻求證</h4>
                        <p class="text-xs text-slate-600 leading-relaxed">遇到親友借錢先打電話確認本人；任何可疑訊息皆可撥打 <strong>165 反詐騙諮詢專線</strong> 或向師長、家長求助。</p>
                    </div>
                </div>
                <button type="button" data-action="close-modal" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold text-sm transition-colors">
                    我記住了！
                </button>
            `);
        }

        // ==========================================
        // 4. 全域事件委派與初始化
        // ==========================================
        document.addEventListener('click', (e) => {
            const actionEl = e.target.closest('[data-action]');
            if (actionEl) {
                const action = actionEl.getAttribute('data-action');
                if (action === 'start-scenario') {
                    const scenarioKey = actionEl.getAttribute('data-scenario');
                    if (scenarioKey) startScenario(scenarioKey);
                } else if (action === 'inspect-profile') {
                    inspectProfile();
                } else if (action === 'open-guide') {
                    toggleGuideModal(true);
                } else if (action === 'open-final-report') {
                    showFinalSummaryModal();
                } else if (action === 'close-modal') {
                    closeModal();
                }
                return;
            }

            // 點擊彈窗遮罩空白處關閉視窗
            const overlay = document.getElementById('modal-overlay');
            if (e.target === overlay) {
                closeModal();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            safeCreateIcons();
        });
    </script>
</body>
</html>
